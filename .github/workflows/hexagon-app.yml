name: hexagon-app

# M1 (de-risk) native build: compile upstream llama.cpp WITH the ggml-hexagon
# NPU backend AND our JNI wrapper (llm_jni.cpp) against it, via Qualcomm's
# snapdragon-toolchain. Produces the full set of arm64 .so (libllm.so +
# libllama/ggml + libggml-htp-v73/v81) that a Hexagon-enabled APK will package.
# Separate from build.yml so the normal app keeps building while we iterate.
on:
  workflow_dispatch:
    inputs:
      llama_ref:
        description: "llama.cpp git ref (tag/branch/sha) with ggml-hexagon"
        default: "master"

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone llama.cpp
        run: |
          git clone --depth 1 --branch "${{ github.event.inputs.llama_ref }}" \
            https://github.com/ggml-org/llama.cpp.git llama.cpp \
            || git clone https://github.com/ggml-org/llama.cpp.git llama.cpp

      - name: Build llama.cpp(+Hexagon) and libllm.so via snapdragon-toolchain
        run: |
          docker run --rm -u 0:0 -v "$PWD":/workspace -w /workspace \
            ghcr.io/snapdragon-toolchain/arm64-android:v0.7 bash -lc '
              set -euo pipefail
              cd llama.cpp
              cp docs/backend/snapdragon/CMakeUserPresets.json .
              cmake --preset arm64-android-snapdragon-release -B build-snap
              cmake --build build-snap -j"$(nproc)"
              cmake --install build-snap --prefix /workspace/pkg
              cd /workspace

              CLANG="$(find /opt -name "aarch64-linux-android31-clang++" 2>/dev/null | head -1)"
              echo "Using clang: $CLANG"
              test -n "$CLANG"

              mkdir -p out
              "$CLANG" -fPIC -shared -std=c++17 -fexceptions -frtti -O2 \
                -I pkg/include \
                app/src/main/cpp/llm_jni.cpp \
                -Lpkg/lib -lllama -lggml -lggml-base -lggml-cpu \
                -llog -landroid \
                -Wl,--allow-shlib-undefined \
                -o out/libllm.so

              # Collect every runtime .so the APK will need.
              cp pkg/lib/libllama.so pkg/lib/libggml*.so out/
              # c++_shared from the NDK sysroot
              CXXSO="$(find /opt -name libc++_shared.so -path "*aarch64*" 2>/dev/null | head -1)"
              [ -n "$CXXSO" ] && cp "$CXXSO" out/ || echo "warn: libc++_shared.so not found"
              echo "=== produced ==="; ls -la out/
              echo "=== libllm.so NEEDED ==="; "$CLANG" --version >/dev/null; readelf -d out/libllm.so 2>/dev/null | grep NEEDED || true
            '

      - name: Upload native libs
        uses: actions/upload-artifact@v4
        with:
          name: hexagon-native
          path: out/**
          if-no-files-found: error

  apk:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download native libs
        uses: actions/download-artifact@v4
        with:
          name: hexagon-native
          path: native-libs

      - name: Stage prebuilt .so into jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp native-libs/*.so app/src/main/jniLibs/arm64-v8a/
          echo "=== jniLibs ==="; ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.9; fi
          chmod +x gradlew

      - name: Build Hexagon APK (prebuilt libs, no CMake)
        env:
          DIAG_PAT: ${{ secrets.DIAG_PAT }}
        run: ./gradlew :app:assembleDebug -Phexagon --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             artifacts/wiki-llm-hexagon-${{ github.run_number }}-debug.apk
          ls -lh artifacts/

      - name: Upload Hexagon APK
        uses: actions/upload-artifact@v4
        with:
          name: wiki-llm-hexagon-apk
          path: artifacts/*.apk
          if-no-files-found: error
